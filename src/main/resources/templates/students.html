
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registered Students</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #222222;
            margin: 0;
            padding: 40px 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #cccccc;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Dark/Light Mode Button */

        .theme-button {
            display: block;
            margin: 0 auto 25px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #333333;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .theme-button:hover {
            background-color: #555555;
        }

        /* Search */

        .search-form {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .search-input {
            width: 60%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-size: 15px;
            background-color: white;
            color: #222222;
        }

        .search-button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #333333;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .search-button:hover {
            background-color: #555555;
        }

        /* Table */

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 750px;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #cccccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #333333;
            color: white;
        }

        td {
            background-color: #ffffff;
        }

        /* Action Links */

        td a {
            margin: 0 5px;
            text-decoration: none;
            color: #333333;
            font-weight: bold;
        }

        td a:hover {
            text-decoration: underline;
        }

        /* Buttons */

        .button {
            display: block;
            width: 220px;
            margin: 15px auto 0;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            background-color: #333333;
            color: white;
            border-radius: 5px;
        }

        .button:hover {
            background-color: #555555;
        }

        /* Dark Mode */

        body.dark-mode {
            background-color: #1e1e1e;
            color: #ffffff;
        }

        body.dark-mode .container {
            background-color: #2b2b2b;
            box-shadow: 0 0 10px #111111;
        }

        body.dark-mode .theme-button {
            background-color: #eeeeee;
            color: #222222;
        }

        body.dark-mode .theme-button:hover {
            background-color: #cccccc;
        }

        body.dark-mode .search-input {
            background-color: #3a3a3a;
            color: #ffffff;
            border-color: #666666;
        }

        body.dark-mode .search-input::placeholder {
            color: #cccccc;
        }

        body.dark-mode th {
            background-color: #111111;
        }

        body.dark-mode td {
            background-color: #3a3a3a;
            color: #ffffff;
            border-color: #666666;
        }

        body.dark-mode td a {
            color: #ffffff;
        }

        body.dark-mode .search-button {
            background-color: #555555;
        }

        body.dark-mode .search-button:hover {
            background-color: #777777;
        }

        body.dark-mode .button {
            background-color: #555555;
        }

        body.dark-mode .button:hover {
            background-color: #777777;
        }

        /* Tablet */

        @media (max-width: 768px) {

            body {
                padding: 20px 10px;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 26px;
            }

            .search-input {
                width: 70%;
            }

        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
                border-radius: 8px;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 20px;
            }

            /* Mobile Search */

            .search-form {
                flex-direction: column;
                width: 100%;
            }

            .search-input {
                width: 100%;
                padding: 12px;
            }

            .search-button {
                width: 100%;
                padding: 12px;
                margin-top: 5px;
            }

            /* Mobile Table */

            .table-container {
                overflow-x: auto;
            }

            table {
                min-width: 750px;
            }

            th,
            td {
                padding: 10px;
                font-size: 14px;
            }

            /* Mobile Buttons */

            .button {
                width: 100%;
                margin-top: 12px;
            }

            .theme-button {
                width: 100%;
                margin-bottom: 20px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Registered Students</h1>

        <!-- Dark/Light Mode -->

        <button type="button" id="themeToggle" class="theme-button">
            🌙 Dark Mode
        </button>

        <!-- Search Form -->

        <form action="/search" method="get" class="search-form">

            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   placeholder="Search student by name"
                   class="search-input">

            <button type="submit" class="search-button">
                Search
            </button>

        </form>

        <!-- Responsive Table -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Phone</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody>

                    <tr th:each="student : ${students}">

                        <td th:text="${student.id}"></td>

                        <td th:text="${student.name}"></td>

                        <td th:text="${student.email}"></td>

                        <td th:text="${student.department}"></td>

                        <td th:text="${student.phone}"></td>

                        <td>

                            <a th:href="@{/edit/{id}(id=${student.id})}">
                                Edit
                            </a>

                            <a th:href="@{/delete/{id}(id=${student.id})}"
                               onclick="return confirm('Are you sure you want to delete this student?');">
                                Delete
                            </a>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <!-- Export CSV Button -->

        <a href="/export" class="button">
            📥 Export Students to CSV
        </a>

        <!-- Dashboard Button -->

        <a href="/dashboard" class="button">
            📊 Dashboard
        </a>

        <!-- Register Button -->

        <a href="/" class="button">
            Register Another Student
        </a>

    </div>

    <script>

        const themeToggle = document.getElementById("themeToggle");

        themeToggle.addEventListener("click", function () {

            document.body.classList.toggle("dark-mode");

            if (document.body.classList.contains("dark-mode")) {

                themeToggle.textContent = "☀️ Light Mode";

            } else {

                themeToggle.textContent = "🌙 Dark Mode";

            }

        });

    </script>

</body>

</html>
