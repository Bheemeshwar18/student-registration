<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        color: #222222;
        margin: 0;
        padding: 40px 20px;
        transition: background-color 0.3s, color 0.3s;
    }

    .container {
        width: 100%;
        max-width: 1100px;
        margin: auto;
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px #cccccc;
        transition: background-color 0.3s, box-shadow 0.3s;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .theme-button {
        display: block;
        margin: 0 auto 30px;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        background-color: #333333;
        color: white;
        cursor: pointer;
        font-size: 15px;
    }

    .theme-button:hover {
        background-color: #555555;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 35px;
    }

    .card {
        padding: 25px;
        text-align: center;
        border-radius: 10px;
        background-color: #eeeeee;
        transition: background-color 0.3s;
    }

    .card h2 {
        margin: 10px 0;
    }

    .card p {
        font-size: 28px;
        font-weight: bold;
        margin: 0;
    }

    .chart-container {
        width: 100%;
        max-width: 700px;
        margin: 0 auto 30px;
    }

    .button {
        display: block;
        width: 250px;
        margin: 12px auto;
        padding: 12px;
        text-align: center;
        text-decoration: none;
        background-color: #333333;
        color: white;
        border-radius: 5px;
    }

    .button:hover {
        background-color: #555555;
    }

    /* Dark Mode */

    body.dark-mode {
        background-color: #1e1e1e;
        color: #ffffff;
    }

    body.dark-mode .container {
        background-color: #2b2b2b;
        box-shadow: 0 0 10px #111111;
    }

    body.dark-mode .card {
        background-color: #3a3a3a;
    }

    body.dark-mode .theme-button {
        background-color: #eeeeee;
        color: #222222;
    }

    body.dark-mode .theme-button:hover {
        background-color: #cccccc;
    }

    body.dark-mode .button {
        background-color: #555555;
    }

    body.dark-mode .button:hover {
        background-color: #777777;
    }

    @media (max-width: 768px) {

        .cards {
            grid-template-columns: repeat(2, 1fr);
        }

    }

    @media (max-width: 600px) {

        body {
            padding: 10px;
        }

        .container {
            padding: 20px;
        }

        h1 {
            font-size: 24px;
        }

        .cards {
            grid-template-columns: 1fr;
        }

        .button {
            width: 100%;
        }

    }

</style>
```

</head>

<body>

```
<div class="container">

    <h1>📊 Student Dashboard</h1>

    <button id="themeToggle" class="theme-button">
        🌙 Dark Mode
    </button>

    <div class="cards">

        <div class="card">
            <h2>Total Students</h2>
            <p th:text="${totalStudents}">0</p>
        </div>

        <div class="card">
            <h2>CSE</h2>
            <p th:text="${cseStudents}">0</p>
        </div>

        <div class="card">
            <h2>CSE-AI & ML</h2>
            <p th:text="${aiMlStudents}">0</p>
        </div>

        <div class="card">
            <h2>ECE</h2>
            <p th:text="${eceStudents}">0</p>
        </div>

        <div class="card">
            <h2>EEE</h2>
            <p th:text="${eeeStudents}">0</p>
        </div>

        <div class="card">
            <h2>Mechanical</h2>
            <p th:text="${mechStudents}">0</p>
        </div>

        <div class="card">
            <h2>Civil</h2>
            <p th:text="${civilStudents}">0</p>
        </div>

    </div>

    <div class="chart-container">

        <canvas id="departmentChart"></canvas>

    </div>

    <a href="/students" class="button">
        👨‍🎓 View Registered Students
    </a>

    <a href="/activity" class="button">
        📝 Activity Log
    </a>

    <a href="/" class="button">
        ➕ Register New Student
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script th:inline="javascript">

    const cse = /*[[${cseStudents}]]*/ 0;
    const aiMl = /*[[${aiMlStudents}]]*/ 0;
    const ece = /*[[${eceStudents}]]*/ 0;
    const eee = /*[[${eeeStudents}]]*/ 0;
    const mech = /*[[${mechStudents}]]*/ 0;
    const civil = /*[[${civilStudents}]]*/ 0;

    const ctx = document.getElementById('departmentChart');

    new Chart(ctx, {

        type: 'bar',

        data: {

            labels: [
                'CSE',
                'CSE-AI & ML',
                'ECE',
                'EEE',
                'Mechanical',
                'Civil'
            ],

            datasets: [{

                label: 'Students',

                data: [
                    cse,
                    aiMl,
                    ece,
                    eee,
                    mech,
                    civil
                ]

            }]

        },

        options: {

            responsive: true,

            scales: {

                y: {
                    beginAtZero: true
                }

            }

        }

    });

    const themeToggle = document.getElementById("themeToggle");

    themeToggle.addEventListener("click", function () {

        document.body.classList.toggle("dark-mode");

        if (document.body.classList.contains("dark-mode")) {

            themeToggle.textContent = "☀️ Light Mode";

        } else {

            themeToggle.textContent = "🌙 Dark Mode";

        }

    });

</script>


</body>

</html>
