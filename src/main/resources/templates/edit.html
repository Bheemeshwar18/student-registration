
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #222222;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: 60px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #cccccc;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Dark/Light Mode Button */

        .theme-button {
            display: block;
            margin: 0 auto 25px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #333333;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .theme-button:hover {
            background-color: #555555;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            background-color: white;
            color: #222222;
        }

        .update-button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: none;
            border-radius: 5px;
            background-color: #333333;
            color: white;
            cursor: pointer;
        }

        .update-button:hover {
            background-color: #555555;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #333333;
        }

        .back:hover {
            text-decoration: underline;
        }

        /* Dark Mode */

        body.dark-mode {
            background-color: #1e1e1e;
            color: #ffffff;
        }

        body.dark-mode .container {
            background-color: #2b2b2b;
            box-shadow: 0 0 10px #111111;
        }

        body.dark-mode input,
        body.dark-mode select {
            background-color: #3a3a3a;
            color: #ffffff;
            border-color: #666666;
        }

        body.dark-mode input::placeholder {
            color: #cccccc;
        }

        body.dark-mode .theme-button {
            background-color: #eeeeee;
            color: #222222;
        }

        body.dark-mode .theme-button:hover {
            background-color: #cccccc;
        }

        body.dark-mode .update-button {
            background-color: #555555;
        }

        body.dark-mode .update-button:hover {
            background-color: #777777;
        }

        body.dark-mode .back {
            color: #ffffff;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .container {
                margin: 30px auto;
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .theme-button {
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Edit Student</h1>

        <!-- Dark/Light Mode -->

        <button type="button" id="themeToggle" class="theme-button">
            🌙 Dark Mode
        </button>

        <form action="/update" method="post">

            <input type="hidden"
                   name="id"
                   th:value="${student.id}">

            <label for="name">
                Student Name
            </label>

            <input type="text"
                   id="name"
                   name="name"
                   th:value="${student.name}"
                   required>

            <label for="email">
                Email
            </label>

            <input type="email"
                   id="email"
                   name="email"
                   th:value="${student.email}"
                   required>

            <label for="department">
                Department
            </label>

            <select id="department"
                    name="department"
                    required>

                <option value="">
                    Select Department
                </option>

                <option value="CSE"
                        th:selected="${student.department == 'CSE'}">
                    CSE
                </option>

                <option value="CSE-AI & ML"
                        th:selected="${student.department == 'CSE-AI & ML'}">
                    CSE-AI & ML
                </option>

                <option value="ECE"
                        th:selected="${student.department == 'ECE'}">
                    ECE
                </option>

                <option value="EEE"
                        th:selected="${student.department == 'EEE'}">
                    EEE
                </option>

                <option value="MECH"
                        th:selected="${student.department == 'MECH'}">
                    Mechanical
                </option>

                <option value="CIVIL"
                        th:selected="${student.department == 'CIVIL'}">
                    Civil
                </option>

            </select>

            <label for="phone">
                Phone Number
            </label>

            <input type="tel"
                   id="phone"
                   name="phone"
                   th:value="${student.phone}"
                   required>

            <button type="submit" class="update-button">
                Update Student
            </button>

        </form>

        <a href="/students" class="back">
            Back to Students
        </a>

    </div>

    <script>

        const themeToggle = document.getElementById("themeToggle");

        themeToggle.addEventListener("click", function () {

            document.body.classList.toggle("dark-mode");

            if (document.body.classList.contains("dark-mode")) {

                themeToggle.textContent = "☀️ Light Mode";

            } else {

                themeToggle.textContent = "🌙 Dark Mode";

            }

        });

    </script>

</body>

</html>
